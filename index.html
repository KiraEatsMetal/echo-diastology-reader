<!DOCTYPE html>
<html>
<head>
    <title>Echo Diastology Flowchart Solver</title>
	<link rel="stylesheet" type="text/css" href="css/site.css">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="js/libraries/opencv.js" type="text/javascript"></script>
    <script src="js/echo-d-math.js" type="module" defer></script>
</head>
<body>
    <h1>Echo Diastology Flowchart Solver V1.2.7</h1>
    <h2>Enter parameters:</h2>

    <label for="ImageInput">OCR Image Input:</label><br>
    <input type="file" id="ImageInput" name="ImageInput" multiple><br>
    <textarea id="OCROutput"></textarea><br>

    <label for="averageEe">average E/e':</label><br>
    <input type="text" id="averageEe" name="EeAverage"><canvas id="dataDisplay1" width="10" height="100" class="data-display"></canvas><br>
    <label for="epSeptal">e' septal (m/s):</label><br>
    <input type="text" id="epSeptal" name="epSeptal"><canvas id="dataDisplay2" width="10" height="100" class="data-display"></canvas><br>
    <label for="LAVI">LA Vol Index (LAVI):</label><br>
    <input type="text" id="LAVI" name="LAVI"><canvas id="dataDisplay3" width="10" height="100" class="data-display"></canvas><br>
    <label for="epLateral">e' lateral (m/s):</label><br>
    <input type="text" id="epLateral" name="epLateral"><canvas id="dataDisplay4" width="10" height="100" class="data-display"></canvas><br>
    <label for="TRVelocity">TR velocity (m/s):</label><br>
    <input type="text" id="TRVelocity" name="TRVelocity"><canvas id="dataDisplay5" width="10" height="100" class="data-display"></canvas><br>
    <label for="EA">E/A:</label><br>
    <input type="text" id="EA" name="EA"><canvas id="dataDisplay6" width="10" height="100" class="data-display"></canvas><br>
    <label for="EeSeptal">E/e' septal:</label><br>
    <input type="text" id="EeSeptal" name="EeSeptal"><br>
    <label for="EeLateral">E/e' lateral:</label><br>
    <input type="text" id="EeLateral" name="EeLateral"><br>

    <br><button id="inputButton">Calculate</button><br>

    <div id="warnings">no warnings</div>
    <div id="output">output</div><br>
    <textarea id="BatchOutput"></textarea><br>
    <img id="imageSrc" alt=""/>
    <canvas id="canvasOutput" width="15" height="1"></canvas>
    <canvas id="debugCanvasOutputOne" width="15" height="1"></canvas>
    <!---->
    <!--<canvas id="debugCanvasOutputTwo"></canvas>-->
    <!--<canvas id="debugCanvasOutputThree"></canvas>-->

</body>
</html>
